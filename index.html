<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puerto Vallarta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gate">
  <div class="gate-card" id="gate-card">
    <p class="gate-eyebrow">Acceso privado</p>
    <h1>Inicia con tu nombre</h1>
    <form class="gate-form" id="gate-form">
      <label for="gate-input" class="sr-only">Tu nombre</label>
      <input type="text" id="gate-input" placeholder="Tu nombre" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit">Entrar</button>
    </form>
    <p class="gate-error" id="gate-error" hidden>Ese no es tu nombre. Intenta de nuevo.</p>
  </div>
</div>

<script>
  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-input');
  var card = document.getElementById('gate-card');
  var error = document.getElementById('gate-error');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value.trim().toLowerCase() === 'fersito') {
      window.location.href = 'itinerario.html';
    } else {
      error.hidden = false;
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      input.select();
    }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puerto Vallarta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gate">
  <div class="gate-wrap">
    <p class="gate-eyebrow">Feliz cumpleaños...</p>

    <div class="flip-scene">
      <div class="flip-card" id="flip-card" role="button" tabindex="0" aria-pressed="false" aria-label="Toca la carta para continuar">
        <div class="flip-face front">
          <img src="tluna.jpg" alt="Carta de tarot: La Luna">
          <span class="flip-hint">Toca la carta</span>
        </div>
        <div class="flip-face back">
          <div class="back-content" id="back-content">
            <h1>Inicia con tu nombre</h1>
            <form class="gate-form" id="gate-form">
              <label for="gate-input" class="sr-only">Tu nombre</label>
              <input type="text" id="gate-input" placeholder="Escribe tu &quot;nombre&quot; :)" autocomplete="off" autocapitalize="off" spellcheck="false">
              <button type="submit">Entrar</button>
            </form>
            <p class="gate-error" id="gate-error" hidden>Ese no es tu nombre. Intenta de nuevo.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var flipCard = document.getElementById('flip-card');
  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-input');
  var backContent = document.getElementById('back-content');
  var error = document.getElementById('gate-error');

  function toggleFlip() {
    var isFlipped = flipCard.classList.toggle('flipped');
    flipCard.setAttribute('aria-pressed', isFlipped ? 'true' : 'false');
    if (isFlipped) {
      window.setTimeout(function () { input.focus(); }, 450);
    } else {
      error.hidden = true;
      flipCard.focus();
    }
  }

  flipCard.addEventListener('click', function (e) {
    if (e.target.closest('.gate-form')) return;
    toggleFlip();
  });
  flipCard.addEventListener('keydown', function (e) {
    if (e.target !== flipCard) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleFlip();
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    e.stopPropagation();
    if (input.value.trim().toLowerCase() === 'fersito') {
      window.location.href = 'itinerario.html';
    } else {
      error.hidden = false;
      backContent.classList.remove('shake');
      void backContent.offsetWidth;
      backContent.classList.add('shake');
      input.select();
    }
  });
</script>
</body>
</html>
